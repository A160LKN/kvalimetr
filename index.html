<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Квалиметр — тренажёр экзаменов: случайные тесты из больших баз сложных вопросов, разбор ошибок и повторное прохождение.">
<title>Квалиметр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: экзаменационный бланк — лента сверху, лист с заданием, сетка номеров как в бланке ответов */
:root{
  --bg:#eef2f3; --paper:#ffffff; --ink:#14212b; --muted:#5b6b76; --line:#d5dee2; --soft:#e7edf0;
  --accent:#0d6b86; --accent-ink:#ffffff; --accent-soft:#dcedf2;
  --ok:#1d7a4a; --ok-soft:#dcf1e5; --bad:#b4372f; --bad-soft:#f8e0dd; --warn:#a86a07; --warn-soft:#fbeed2;
  --f-display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --paper:#16222a; --ink:#e3ecef; --muted:#93a4ad; --line:#2a3a44; --soft:#1d2c35;
  --accent:#4fb3d1; --accent-ink:#06222c; --accent-soft:#16384a;
  --ok:#5ccf8f; --ok-soft:#163a28; --bad:#f08077; --bad-soft:#41201d; --warn:#f0b44c; --warn-soft:#3d2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --paper:#16222a; --ink:#e3ecef; --muted:#93a4ad; --line:#2a3a44; --soft:#1d2c35;
  --accent:#4fb3d1; --accent-ink:#06222c; --accent-soft:#16384a;
  --ok:#5ccf8f; --ok-soft:#163a28; --bad:#f08077; --bad-soft:#41201d; --warn:#f0b44c; --warn-soft:#3d2e12; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(1.5rem,3.6vw,2.2rem)} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.86rem}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.band{background:var(--ink);color:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.band .wrap{display:flex;align-items:center;gap:16px;min-height:56px;padding-block:6px}
.brand{font-family:var(--f-display);font-size:1rem;font-weight:700;background:none;border:0;color:inherit;padding:6px 0;display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
.band .ctx{margin-left:auto;font-size:.86rem;opacity:.75;text-align:right}

main{padding-block:28px 64px}
.view{display:grid;gap:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.pill{display:inline-flex;align-items:center;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}

/* home */
.intro{display:grid;gap:10px;max-width:68ch}
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.subj{display:grid;gap:14px;align-content:space-between}
.subj .top{display:grid;gap:6px}
.subj .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.subj .meta b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.subj.mix{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center}
.resume{border-color:var(--warn);background:var(--warn-soft)}

/* test */
.test-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.progress{flex:1 1 220px;display:grid;gap:6px}
.track{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent)}
.test-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:start}
.qwrap{display:grid;gap:16px}
.qwrap.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.passage{background:var(--soft);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start;max-height:72vh;overflow:auto}
.passage p{max-width:65ch}
.qcard{display:grid;gap:16px;align-content:start}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qnum{font-family:var(--f-mono);font-weight:600}
.qtext{font-size:1.04rem;max-width:70ch;min-width:0}
.qtext pre{font-family:var(--f-mono);font-size:.85rem;background:var(--soft);padding:10px 12px;border-radius:6px;overflow-x:auto;margin:10px 0}
.qtext table{border-collapse:collapse;margin:10px 0;font-size:.9rem;font-family:var(--f-mono)}
.qtext td,.qtext th{border:1px solid var(--line);padding:3px 10px;text-align:left}
.qtext th{background:var(--soft)}
.qtext i{color:var(--muted)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--soft);padding:1px 5px;border-radius:4px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:11px 14px}
.opt:hover{border-color:var(--accent)}
.opt .mk{flex:none;width:24px;height:24px;display:grid;place-items:center;border:1.5px solid var(--muted);border-radius:50%;font-family:var(--f-mono);font-size:.78rem;font-weight:600;margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .mk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.qnav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.palette{position:sticky;top:76px;display:grid;gap:12px}
.pal-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-family:var(--f-mono);font-size:.72rem;padding:0;border-radius:4px}
.cell.ans{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.kbd{font-size:.76rem;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,24,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .sheet{max-width:440px;width:100%;display:grid;gap:14px}

/* results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.big{font-family:var(--f-mono);font-size:clamp(3rem,9vw,4.6rem);font-weight:600;line-height:1}
.figures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.figures>div{background:var(--paper);padding:12px 14px;display:grid;gap:2px}
.figures .v{font-family:var(--f-mono);font-size:1.4rem;font-weight:600}
.v.ok{color:var(--ok)} .v.bad{color:var(--bad)}
.grade{font-weight:600}
.breakdown{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:.9rem}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.wrong-list{display:grid;gap:12px}
.wi{display:grid;gap:12px;padding:18px}
.ans-line{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:9px 12px;border-radius:8px;align-items:baseline}
.ans-line.bad{background:var(--bad-soft)} .ans-line.ok{background:var(--ok-soft)}
.ans-line .lbl{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ans-line.bad .lbl{color:var(--bad)} .ans-line.ok .lbl{color:var(--ok)}
.ans-line span:last-child{min-width:0;overflow-wrap:anywhere}
.why{font-size:.93rem;border-left:3px solid var(--accent);padding:4px 0 4px 12px}
details summary{cursor:pointer;color:var(--accent);font-size:.88rem}
details .passage{margin-top:8px;max-height:none}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

@media (max-width:860px){
  .subjects{grid-template-columns:1fr}
  .test-grid{grid-template-columns:1fr}
  .palette{position:static}
  .pal-grid{grid-template-columns:repeat(10,minmax(0,1fr))}
  .qwrap.split{grid-template-columns:1fr}
  .passage{max-height:none}
  .score{grid-template-columns:1fr}
}
@media (max-width:520px){
  .sheet{padding:16px}
  .figures{grid-template-columns:1fr}
  .brow{grid-template-columns:minmax(0,1fr) 60px}
  .brow .bar{grid-column:1/-1;grid-row:2}
  .ans-line{grid-template-columns:1fr;gap:2px}
  .band .ctx{display:none}
}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.cell{transition:border-color .12s,background .12s}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <button class="brand" id="brand" aria-label="Квалиметр — на главную"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 15l3-4 3 2 4-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Квалиметр</button>
  <span class="ctx" id="ctx"></span>
</div></header>
<main class="wrap" id="app"></main>
<div id="modal-root"></div>

<script>
/* =====================================================================
   ДАННЫЕ. Формат ручного задания: [сложность h|m, тема, вопрос, [верный, неверный×3], объяснение, текст?]
   ===================================================================== */
const PASSAGES = {
  R1:{title:"Open-source software",text:"Open-source software is software whose source code is made publicly available, allowing anyone to study, modify and distribute it. The idea is older than many people think: in the 1980s, programmers already shared code through academic networks. Today, open-source projects power much of the internet, from web servers to the operating systems on most smartphones.\n\nSupporters argue that open development improves quality, because many independent developers can find and fix errors. Critics, however, point out that popular projects are often maintained by a small number of volunteers who receive little or no payment. When such a maintainer leaves, a library used by thousands of companies may stop receiving security updates.\n\nFor this reason, several large technology firms now pay engineers to work on open-source projects full-time, and some foundations offer grants to independent maintainers."},
  R2:{title:"Cooling data centres",text:"Data centres consume a significant share of the world's electricity, and their demand is growing as more services move to the cloud and artificial intelligence models become larger. Much of this energy is used not for computing but for cooling, since servers produce heat that must be removed to prevent hardware failures.\n\nEngineers have tried several approaches to reduce this cost. Some companies build data centres in cold climates, where outside air can be used for cooling during most of the year. Others place servers in liquid that absorbs heat far more efficiently than air. A third approach is to reuse the waste heat: in some northern cities, heat from data centres warms residential buildings.\n\nNone of these solutions is perfect. Cold regions may be far from users, which increases delays, and liquid cooling requires expensive equipment."},
  R3:{title:"Automated hiring",text:"Automated hiring systems promise to make recruitment faster and more objective. Instead of relying on a recruiter's intuition, they rank candidates using models trained on past hiring decisions. Yet this design contains a hidden weakness. If a company historically favoured graduates of a few universities, a model trained on its records will learn the same preference and present it as a neutral, data-driven judgement.\n\nBecause the ranking appears mathematical, managers may question it less than they would question a human recruiter. Some regulators now require companies to audit such systems regularly and to explain how they reach decisions.\n\nCritics of these rules argue that audits are expensive for small firms; supporters reply that the cost of unfair hiring, both to candidates and to companies that miss talented people, is far higher."}
};

const EN = [
["h","Grammar","Not until the results were published ___ how serious the error had been.",["did we realise","we realised","had we realise","we did realise"],"После Not until в начале предложения нужна инверсия во второй части: did + подлежащее + глагол."],
["h","Grammar","Had I known about the deadline, I ___ the report earlier.",["would have submitted","would submit","had submitted","will have submitted"],"Had I known = If I had known: это третий тип условных предложений, поэтому would have + V3."],
["h","Grammar","She insisted that the contract ___ before the meeting.",["be signed","was signed","is signed","would sign"],"После insist that используется сослагательное наклонение: базовая форма глагола без окончаний (be signed)."],
["h","Grammar","It's high time the government ___ action on data privacy.",["took","takes","has taken","will take"],"После It's high time нужен Past Simple: так выражают, что действие давно пора было сделать."],
["h","Grammar","The new framework, ___ was released last month, has already been adopted by many teams.",["which","that","what","who"],"Придаточное выделено запятыми (non-defining), в нём that не употребляется; для предмета — which."],
["h","Grammar","By this time next year, they ___ the migration to the cloud.",["will have completed","will complete","are completing","would complete"],"By this time next year — действие завершится к моменту в будущем: Future Perfect."],
["h","Grammar","No sooner ___ the server than it crashed again.",["had they restarted","they had restarted","did they restarted","have they restarted"],"Конструкция No sooner had + подлежащее + V3 … than требует инверсии и Past Perfect."],
["h","Grammar","I'd rather you ___ my code without asking.",["didn't change","don't change","won't change","not change"],"После would rather + другое лицо используется Past Simple, даже если речь о настоящем."],
["h","Grammar","Little ___ that the startup would become a global company.",["did they suspect","they suspected","they did suspect","suspected they"],"Little в начале предложения имеет отрицательный смысл и вызывает инверсию с вспомогательным did."],
["h","Grammar","The bug must ___ during the last update, because everything worked yesterday.",["have been introduced","be introduced","have introduced","being introduced"],"Уверенное предположение о прошлом — must have + V3; ошибку «внесли», поэтому пассив: have been introduced."],
["h","Grammar","Scarcely had the meeting begun ___ the fire alarm went off.",["when","than","that","then"],"Пара Scarcely/Hardly … when (а than — только после No sooner)."],
["h","Grammar","Were the company ___ its prices, it would lose customers.",["to raise","raise","raising","raised"],"Were + подлежащее + to-инфинитив — инвертированная форма If the company were to raise."],
["h","Grammar","If he hadn't missed the flight, he ___ in Berlin now.",["would be","would have been","will be","had been"],"Смешанное условное: условие в прошлом (hadn't missed), результат в настоящем (now) → would be."],
["h","Grammar","The report ___ by the time the manager arrived.",["had already been finished","has already been finished","was already finishing","already finished"],"Действие завершилось до другого прошлого действия, а отчёт сам себя не пишет: Past Perfect Passive."],
["h","Grammar","Only after testing every module ___ the product ready for release.",["did they declare","they declared","they did declare","declared they"],"Only after … в начале предложения вызывает инверсию в главной части: did they declare."],
["h","Grammar","Neither of the proposed solutions ___ acceptable to the client.",["was","were","have been","are being"],"В формальном английском neither of + существительное во мн. ч. согласуется с глаголом в ед. ч."],
["h","Grammar","The number of applicants ___ increased significantly this year.",["has","have","are","were"],"The number of … — подлежащее «число», единственное число: has."],
["h","Grammar","A number of students ___ complained about the new schedule.",["have","has","is","was"],"A number of = «многие», глагол во множественном числе: have."],
["h","Grammar","He denied ___ the confidential files.",["having accessed","to have accessed","to access","access"],"Deny требует герундия; перфектный герундий подчёркивает, что действие было раньше отрицания."],
["h","Grammar","She is said ___ the algorithm herself years ago.",["to have designed","to design","designing","having designed"],"Is said + перфектный инфинитив, потому что действие (years ago) предшествует моменту речи."],
["h","Grammar","You needn't ___ a taxi; I could have driven you.",["have taken","take","had taken","taking"],"Needn't have + V3 — действие совершили, но в нём не было необходимости."],
["h","Grammar","The manager, along with her assistants, ___ attending the conference.",["is","are","were","have been"],"Along with не меняет число подлежащего: подлежащее — the manager (ед. ч.)."],
["h","Grammar","Suppose the system ___ down during the exam — what would you do?",["went","goes","will go","has gone"],"Suppose + Past Simple описывает воображаемую ситуацию; это подтверждает what would you do."],
["h","Grammar","I regret ___ you that your application has been rejected.",["to inform","informing","to have informed","inform"],"Regret to inform — официально сообщать о неприятном сейчас; regret informing — сожалеть о сказанном раньше."],
["h","Grammar","On his way to the office he stopped ___ a coffee.",["to buy","buying","buy","to buying"],"Stop to do — остановиться, чтобы что-то сделать; stop doing — перестать делать."],
["h","Grammar","So complex ___ that only two students solved it.",["was the problem","the problem was","did the problem","the problem did"],"So + прилагательное в начале предложения вызывает инверсию: So complex was the problem."],
["h","Grammar","Under no circumstances ___ share your password.",["should you","you should","you shouldn't","shouldn't you"],"Отрицательное обстоятельство в начале требует инверсии; второе отрицание не нужно."],
["h","Grammar","It was not until 2007 ___ the first iPhone was released.",["that","when","which","since"],"Усилительная конструкция It was not until … that …"],
["h","Grammar","The more you practise, ___ you become.",["the more confident","more confident","the most confident","the confident"],"Парная конструкция The more …, the more … требует артикля the и сравнительной степени в обеих частях."],
["h","Grammar","I wish I ___ to the conference last year — it sounded amazing.",["had gone","went","would go","have gone"],"Сожаление о прошлом: wish + Past Perfect."],
["h","Grammar","I wish you ___ interrupting me while I'm coding!",["would stop","stopped","had stopped","will stop"],"Wish + would выражает раздражение чужим поведением, которое хочется изменить."],
["h","Grammar","The project, ___ budget was cut twice, was finally cancelled.",["whose","which","of that","its"],"Whose — притяжательное относительное местоимение («бюджет которого»)."],
["h","Grammar","He is used to ___ late, so the night shift doesn't bother him.",["working","work","have worked","be working"],"Be used to (привык) + герундий; to здесь предлог."],
["h","Grammar","Rarely ___ such an elegant solution.",["have I seen","I have seen","I saw","did I saw"],"Rarely в начале предложения вызывает инверсию: have I seen."],
["h","Grammar","It's no use ___ about the bug; let's fix it.",["complaining","to complain","complain","complained"],"It's no use / It's no good + герундий."],
["h","Grammar","The proposal was rejected on the grounds ___ it was too expensive.",["that","of","which","for"],"Устойчивый союз on the grounds that — «на том основании, что»."],
["h","Grammar","Should you ___ any problems, contact the administrator.",["encounter","encountered","encountering","to encounter"],"Should + подлежащее + базовая форма = If you encounter (инверсия в условии первого типа)."],
["h","Grammar","Not only ___ the deadline, but they also exceeded the budget.",["did they miss","they missed","they did miss","missed they"],"Not only в начале предложения требует инверсии: did they miss."],
["h","Grammar","Choose the grammatically correct sentence.",["Each of the developers has their own laptop.","Each of the developers have their own laptop.","Each developers has his own laptop.","Every of the developers has a laptop."],"Each of + мн. ч. согласуется с глаголом в ед. ч.; every of не употребляется."],
["h","Grammar","Choose the grammatically correct sentence.",["The fewer bugs we have, the faster we can release.","The less bugs we have, the more faster we can release.","Fewer bugs we have, faster we release.","The fewer bugs we have, the more fast we can release."],"Bugs исчисляемые → fewer; faster уже сравнительная степень, more не добавляется."],

/* =====================================================================
   ГЕНЕРАТОРЫ ЗАДАНИЙ (детерминированный seed → стабильная база)
   ===================================================================== */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pk=(r,a)=>a[Math.floor(r()*a.length)];
const shR=(r,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const num=x=>{const v=Math.round(x*100)/100;return String(v).replace(".",",").replace("-","−")};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const frac=(a,b)=>{const g=gcd(a,b);return b/g===1?String(a/g):`${a/g}/${b/g}`};
const comb=(n,k)=>{let c=1;for(let i=1;i<=k;i++)c=c*(n-k+i)/i;return Math.round(c)};
const perm=(n,k)=>{let p=1;for(let i=0;i<k;i++)p*=n-i;return p};
const arr=a=>"["+a.join(", ")+"]";
const SUP={2:"²",3:"³",4:"⁴"};
function nOpts(c,cands,o={}){const min=o.min??-Infinity,fmt=o.fmt||num;const out=[fmt(c)];const add=v=>{if(out.length>=4||typeof v!=="number"||!Number.isFinite(v)||v<min)return;const s=fmt(v);if(!out.includes(s))out.push(s)};cands.forEach(add);for(let k=1;out.length<4&&k<60;k++){add(c+k);add(c-k)}return out.length===4?out:null}
function sOpts(c,cands){const out=[c];cands.forEach(x=>{if(out.length<4&&x!=null&&!out.includes(x))out.push(x)});return out.length===4?out:null}
function tbl(head,rows){return `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v===null?"<i>NULL</i>":v}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
const sgn=c=>c>0?"+ "+c:"− "+(-c);

{t:"Числовые ряды",d:"h",f:r=>{const s=ri(r,1,20),d=ri(r,2,6),k=ri(r,2,5);const a=[s];let df=d;for(let i=0;i<6;i++){a.push(a[a.length-1]+df);df+=k}const c=a[6];return{q:`Продолжите ряд: ${a.slice(0,6).join(", ")}, …`,o:nOpts(c,[a[5]+(a[5]-a[4]),c+k,c-k+1,c+1]),e:`Разности соседних членов растут на ${k}: ${range(0,4).map(i=>a[i+1]-a[i]).join(", ")}. Следующая разность ${c-a[5]}, поэтому ${a[5]} + ${c-a[5]} = ${c}.`}}},
{t:"Числовые ряды",d:"h",f:r=>{let x=ri(r,1,5);const m=ri(r,2,3),c=pk(r,[-2,-1,1,2,3]);const a=[x];for(let i=0;i<5;i++){x=x*m+c;a.push(x)}if(a.some(v=>v<=0))return null;return{q:`Продолжите ряд: ${a.slice(0,5).join(", ")}, …`,o:nOpts(a[5],[a[4]*m,a[4]*m+c+1,a[4]*m-c,a[4]+(a[4]-a[3])*m]),e:`Каждый следующий член получается по правилу «× ${m} ${sgn(c)}»: ${a[4]} · ${m} ${sgn(c)} = ${a[5]}.`}}},
{t:"Числовые ряды",d:"h",f:r=>{const x=ri(r,1,10),dx=ri(r,2,5),y=ri(r,25,45),dy=ri(r,2,6);const c=x+3*dx;return{q:`Продолжите ряд: ${[x,y,x+dx,y-dy,x+2*dx,y-2*dy].join(", ")}, …`,o:nOpts(c,[y-3*dy,c+dx,c-1,c+1]),e:`Здесь два чередующихся ряда: на нечётных местах ${x}, ${x+dx}, ${x+2*dx} (шаг +${dx}), на чётных ${y}, ${y-dy}, ${y-2*dy} (шаг −${dy}). Седьмой член относится к первому ряду: ${x+2*dx} + ${dx} = ${c}.`}}},
{t:"Числовые ряды",d:"h",f:r=>{const n0=ri(r,2,7),p=pk(r,[2,3]),ad=pk(r,[-2,-1,1,2,3]);const a=range(0,5).map(i=>Math.pow(n0+i,p)+ad);return{q:`Продолжите ряд: ${a.slice(0,5).join(", ")}, …`,o:nOpts(a[5],[Math.pow(n0+5,p),a[5]+(a[4]-a[3]),Math.pow(n0+6,p)+ad,a[5]+1]),e:`Члены ряда — n${SUP[p]} ${sgn(ad)} для n = ${n0}, ${n0+1}, …. Шестой член: ${n0+5}${SUP[p]} ${sgn(ad)} = ${a[5]}.`}}},
{t:"Числовые ряды",d:"h",f:r=>{const a=[ri(r,1,6),ri(r,2,9)];while(a.length<7)a.push(a[a.length-1]+a[a.length-2]);return{q:`Продолжите ряд: ${a.slice(0,6).join(", ")}, …`,o:nOpts(a[6],[2*a[5],a[5]+a[3],a[6]-1,a[6]+1]),e:`Каждый член равен сумме двух предыдущих: ${a[4]} + ${a[5]} = ${a[6]}.`}}},
{t:"Проценты",d:"h",f:r=>{const P=ri(r,2,9)*1000,x=pk(r,[10,20,30,40]),y=pk(r,[10,20,30,40]);const c=P*(100+x)*(100-y)/10000;return{q:`Цену товара ${P} ₸ сначала повысили на ${x}%, а затем снизили на ${y}%. Какой стала цена?`,o:nOpts(c,[P*(100+x-y)/100,P,c+P/10,c-P/20],{fmt:v=>num(v)+" ₸",min:0}),e:`Проценты применяются по очереди: ${P} · ${num((100+x)/100)} = ${num(P*(100+x)/100)}, затем · ${num((100-y)/100)} = ${num(c)} ₸. Складывать проценты (${x}% − ${y}%) нельзя: второе изменение считается от уже новой цены.`}}},
{t:"Проценты",d:"h",f:r=>{const [x,y]=pk(r,[[25,20],[100,50],[60,37.5],[150,60],[300,75],[400,80],[20,100/6]]);const what=pk(r,["цену","тариф","зарплату","стоимость подписки"]);if(y===100/6)return null;return{q:`${what[0].toUpperCase()+what.slice(1)} повысили на ${x}%. На сколько процентов теперь нужно её снизить, чтобы вернуться к исходному значению?`,o:sOpts(num(y)+"%",[x+"%",num(x/2)+"%",num(100-y)+"%",num(y+5)+"%"]),e:`После повышения значение равно ${num(1+x/100)} от исходного. Снижение должно составить ${x} / ${100+x} = ${num(y)}% от нового значения, а не ${x}%.`}}},
{t:"Совместная работа",d:"h",f:r=>{const [a,b]=pk(r,[[3,6],[4,12],[6,12],[10,15],[12,24],[20,30],[5,20],[15,30],[14,35],[8,24],[9,18],[18,36]]);const who=pk(r,[["оператор","оператор"],["насос","насос"],["принтер","принтер"],["сервер","сервер"]]);const c=a*b/(a+b);return{q:`Первый ${who[0]} выполняет работу за ${a} ч, второй — за ${b} ч. За сколько часов они выполнят её, работая вместе?`,o:nOpts(c,[(a+b)/2,Math.min(a,b)/2,a+b,c+1],{fmt:v=>num(v)+" ч",min:0.5}),e:`Производительности складываются: 1/${a} + 1/${b} = ${frac(a+b,a*b)} работы в час, значит, вся работа займёт ${frac(a*b,a+b)} = ${num(c)} ч.`}}},
{t:"Совместная работа",d:"h",f:r=>{const [a,b]=pk(r,[[3,6],[4,12],[6,12],[10,15],[12,24],[20,30],[5,20],[15,30],[14,35],[8,24],[9,18],[18,36]]);const c=a*b/(a+b);return{q:`Две бригады вместе выполняют заказ за ${num(c)} дн., первая бригада одна — за ${a} дн. За сколько дней выполнит заказ одна вторая бригада?`,o:nOpts(b,[a,2*c,b-a+c,b+a/2],{fmt:v=>num(v)+" дн.",min:1}),e:`Производительность второй: 1/${num(c)} − 1/${a} = 1/${b}. Значит, ей нужно ${b} дн.`}}},
{t:"Множества",d:"h",f:r=>{const A=ri(r,3,12),B=ri(r,3,12),C=ri(r,3,12),ab=ri(r,1,6),ac=ri(r,1,6),bc=ri(r,1,6),abc=ri(r,1,4),none=ri(r,0,9);const nA=A+ab+ac+abc,nB=B+ab+bc+abc,nC=C+ac+bc+abc,pAB=ab+abc,pAC=ac+abc,pBC=bc+abc,N=A+B+C+ab+ac+bc+abc+none;return{q:`В группе ${N} студентов. Python изучают ${nA}, Java — ${nB}, SQL — ${nC}. Python и Java — ${pAB}, Python и SQL — ${pAC}, Java и SQL — ${pBC}, все три языка — ${abc}. Сколько студентов не изучают ни один из этих языков?`,o:nOpts(none,[none+abc,none-abc,none+2*abc,none+1],{min:0}),e:`Формула включений-исключений: ${nA} + ${nB} + ${nC} − ${pAB} − ${pAC} − ${pBC} + ${abc} = ${N-none} изучают хотя бы один язык. ${N} − ${N-none} = ${none}.`}}},
{t:"Вероятность",d:"h",f:r=>{const k=pk(r,[3,4,5,6,8,9,10,11]);const pairs=[];for(let i=1;i<=6;i++){const j=k-i;if(j>=1&&j<=6)pairs.push(`(${i}, ${j})`)}const w=pairs.length;return{q:`Бросают две игральные кости. Какова вероятность, что сумма выпавших очков равна ${k}?`,o:sOpts(frac(w,36),[frac(w+1,36),frac(w,11),frac(Math.max(1,w-1),36),frac(w,18)]),e:`Всего 6 · 6 = 36 равновероятных исходов. Сумму ${k} дают ${w}: ${pairs.join(", ")}. Вероятность ${w}/36 = ${frac(w,36)}.`}}},

{t:"Комбинаторика",d:"h",f:r=>{const n=ri(r,6,11),k=ri(r,2,4);const C=comb(n,k),P=perm(n,k);return{q:`Сколькими способами можно выбрать ${k} человек в проектную группу из ${n} кандидатов, если роли в группе одинаковы?`,o:nOpts(C,[P,comb(n,k+1),n*k,comb(n,k-1)],{min:1}),e:`Порядок выбора не важен, поэтому это сочетания: C(${n}, ${k}) = ${n}! / (${k}! · ${n-k}!) = ${C}. Число ${P} получилось бы, если бы роли различались.`}}},

{t:"Текстовые задачи",d:"h",f:r=>{const y=ri(r,4,12),t=ri(r,2,10),k=pk(r,[2,3]);const x=k*(y+t)-t;if(x-y<20||x>65)return null;return{q:`Отцу ${x} лет, сыну ${y}. Через сколько лет отец станет в ${k} раза старше сына?`,o:nOpts(t,[t+1,t-1,t+2,Math.round(x/k)-y],{min:1}),e:`Через t лет: ${x} + t = ${k}·(${y} + t), откуда ${x} − ${k*y} = ${k-1}t и t = ${t}. Проверка: ${x+t} = ${k} · ${y+t}.`}}},

/* ---------- алгоритмы ---------- */
const bubbleS=a=>{a=a.slice();const s=[a.slice()];for(let p=0;p<a.length-1;p++){for(let j=0;j<a.length-1-p;j++)if(a[j]>a[j+1])[a[j],a[j+1]]=[a[j+1],a[j]];s.push(a.slice())}return s};
const insS=a=>{a=a.slice();const s=[a.slice()];for(let i=1;i<a.length;i++){const x=a[i];let j=i-1;while(j>=0&&a[j]>x){a[j+1]=a[j];j--}a[j+1]=x;s.push(a.slice())}return s};
const selS=a=>{a=a.slice();const s=[a.slice()];for(let i=0;i<a.length-1;i++){let m=i;for(let j=i+1;j<a.length;j++)if(a[j]<a[m])m=j;[a[i],a[m]]=[a[m],a[i]];s.push(a.slice())}return s};
function sortGen(fn,name,step,desc){return{t:"Сортировки",d:"h",f:r=>{const a=shR(r,range(1,60)).slice(0,6);const S=fn(a);const k=ri(r,1,3);const o=sOpts(arr(S[k]),[arr(S[k-1]),arr(S[k+1]),arr(bubbleS(a)[k]),arr(insS(a)[k]),arr(selS(a)[k]),arr(S[5])]);if(!o)return null;return{q:`Массив ${arr(a)} сортируют по возрастанию ${name}. Как он будет выглядеть после ${k}-${step}?`,o,e:`${desc} Состояния: ${S.slice(0,k+1).map(arr).join(" → ")}.`}}}}
function bstBuild(keys){let root=null;const ins=(n,k)=>{if(!n)return{k,l:null,r:null};if(k<n.k)n.l=ins(n.l,k);else n.r=ins(n.r,k);return n};keys.forEach(k=>root=ins(root,k));return root}
const preO=n=>n?[n.k,...preO(n.l),...preO(n.r)]:[];
const postO=n=>n?[...postO(n.l),...postO(n.r),n.k]:[];
const lvlO=n=>{const q=[n],o=[];while(q.length){const x=q.shift();o.push(x.k);x.l&&q.push(x.l);x.r&&q.push(x.r)}return o};
const htO=n=>n?1+Math.max(htO(n.l),htO(n.r)):-1;
function heapIns(keys){const h=[];for(const k of keys){h.push(k);let i=h.length-1;while(i>0){const p=(i-1)>>1;if(h[p]>h[i]){[h[p],h[i]]=[h[i],h[p]];i=p}else break}}return h}
function heapify(keys){const h=keys.slice(),n=h.length;const down=i=>{for(;;){let m=i;const l=2*i+1,rr=2*i+2;if(l<n&&h[l]<h[m])m=l;if(rr<n&&h[rr]<h[m])m=rr;if(m===i)return;[h[i],h[m]]=[h[m],h[i]];i=m}};for(let i=(n>>1)-1;i>=0;i--)down(i);return h}
function randGraph(r,n,extra){const E=new Set(),adj=Array.from({length:n+1},()=>[]);const add=(u,v)=>{const k=Math.min(u,v)+"-"+Math.max(u,v);if(u===v||E.has(k))return;E.add(k);adj[u].push(v);adj[v].push(u)};const ord=[1,...shR(r,range(2,n))];for(let i=1;i<n;i++)add(ord[i],ord[ri(r,0,i-1)]);for(let i=0;i<extra;i++)add(ri(r,1,n),ri(r,1,n));adj.forEach(a=>a.sort((x,y)=>x-y));return{edges:[...E].map(k=>k.split("-").map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]),adj}}
const bfsO=(adj,s)=>{const seen=new Set([s]),q=[s],o=[];while(q.length){const u=q.shift();o.push(u);for(const v of adj[u])if(!seen.has(v)){seen.add(v);q.push(v)}}return o};
const dfsO=(adj,s)=>{const seen=new Set(),o=[];const go=u=>{seen.add(u);o.push(u);for(const v of adj[u])if(!seen.has(v))go(v)};go(s);return o};
function graphGen(kind){return{t:"Графы",d:"h",f:r=>{const n=ri(r,6,7);const {edges,adj}=randGraph(r,n,ri(r,2,3));const B=bfsO(adj,1),D=dfsO(adj,1);if(arr(B)===arr(D))return null;const ans=kind==="bfs"?B:D,other=kind==="bfs"?D:B;const p1=[1,...shR(r,range(2,n))],p2=[1,...shR(r,range(2,n))];const o=sOpts(arr(ans),[arr(other),arr(range(1,n)),arr(p1),arr(p2)]);if(!o)return null;return{q:`Неориентированный граф задан рёбрами: ${edges.map(e=>e.join("–")).join(", ")}. Каков порядок посещения вершин при ${kind==="bfs"?"поиске в ширину (BFS)":"рекурсивном поиске в глубину (DFS)"} из вершины 1, если соседи перебираются по возрастанию номеров?`,o,e:kind==="bfs"?`BFS использует очередь и обходит граф по уровням: ${arr(B)}. Для сравнения, DFS дал бы ${arr(D)}.`:`DFS уходит вглубь по первому непосещённому соседу и возвращается назад только в тупике: ${arr(D)}. BFS дал бы ${arr(B)}.`}}}}

{t:"Поиск",d:"h",f:r=>{const n=ri(r,9,15);const a=[ri(r,1,9)];while(a.length<n)a.push(a[a.length-1]+ri(r,1,9));const ti=ri(r,0,n-1),t=a[ti];let l=0,h=n-1,c=0;const path=[];while(l<=h){const m=(l+h)>>1;c++;path.push(a[m]);if(a[m]===t)break;if(a[m]<t)l=m+1;else h=m-1}return{q:`Бинарный поиск ищет число ${t} в массиве ${arr(a)} (индексы с 0, mid = ⌊(l + r) / 2⌋). Сколько сравнений с элементами массива он выполнит?`,o:nOpts(c,[c+1,c-1,Math.ceil(Math.log2(n+1)),ti+1],{min:1}),e:`Проверяемые элементы по порядку: ${path.join(" → ")}. Число сравнений: ${c}.`}}},
{t:"Стеки и очереди",d:"h",f:r=>{const ops=[],st=[],vals=shR(r,range(1,40)),pushed=[];let vi=0;for(let i=0;i<10;i++){if(!st.length||r()<0.58){const v=vals[vi++];st.push(v);pushed.push(v);ops.push(`push(${v})`)}else{st.pop();ops.push("pop()")}}if(!st.length||pushed.length<5)return null;const top=st[st.length-1];return{q:`Над пустым стеком выполнили операции: <code>${ops.join(", ")}</code>. Какое значение окажется на вершине?`,o:sOpts(String(top),shR(r,pushed.filter(v=>v!==top)).map(String)),e:`Стек работает по принципу LIFO. После всех операций (снизу вверх): ${arr(st)}. На вершине ${top}.`}}},
{t:"Стеки и очереди",d:"h",f:r=>{const ops=[],q=[],vals=shR(r,range(1,40)),pushed=[];let vi=0;for(let i=0;i<10;i++){if(!q.length||r()<0.58){const v=vals[vi++];q.push(v);pushed.push(v);ops.push(`enqueue(${v})`)}else{q.shift();ops.push("dequeue()")}}if(!q.length||pushed.length<5)return null;const f=q[0];return{q:`Над пустой очередью выполнили операции: <code>${ops.join(", ")}</code>. Какой элемент окажется в начале очереди?`,o:sOpts(String(f),[String(q[q.length-1]),...shR(r,pushed.filter(v=>v!==f)).map(String)]),e:`Очередь работает по принципу FIFO: dequeue удаляет самый ранний из оставшихся. Итоговое содержимое (от начала): ${arr(q)}.`}}},

{t:"Деревья",d:"h",f:r=>{const keys=shR(r,range(1,60)).slice(0,7);const T=bstBuild(keys);const o=sOpts(arr(preO(T)),[arr(postO(T)),arr(lvlO(T)),arr(keys),arr([...keys].sort((a,b)=>a-b))]);if(!o)return null;return{q:`В пустое двоичное дерево поиска по очереди вставили ключи ${keys.join(", ")}. Каков прямой (pre-order) обход полученного дерева?`,o,e:`Прямой обход: корень → левое поддерево → правое поддерево. Корень ${keys[0]}, обход: ${arr(preO(T))}. Обратный (post-order) был бы ${arr(postO(T))}.`}}},
{t:"Деревья",d:"h",f:r=>{const keys=shR(r,range(1,60)).slice(0,7);const T=bstBuild(keys);const o=sOpts(arr(postO(T)),[arr(preO(T)),arr(lvlO(T)),arr([...keys].sort((a,b)=>a-b)),arr([...keys].reverse())]);if(!o)return null;return{q:`В пустое двоичное дерево поиска по очереди вставили ключи ${keys.join(", ")}. Каков обратный (post-order) обход дерева?`,o,e:`Обратный обход: левое поддерево → правое поддерево → корень, поэтому корень ${keys[0]} будет последним: ${arr(postO(T))}.`}}},
{t:"Деревья",d:"h",f:r=>{const keys=shR(r,range(1,60)).slice(0,8);const T=bstBuild(keys);const h=htO(T);return{q:`В пустое двоичное дерево поиска по очереди вставили ключи ${keys.join(", ")}. Какова высота дерева (высота одного корня = 0)?`,o:nOpts(h,[h+1,h-1,Math.floor(Math.log2(8)),7],{min:0}),e:`Уровни дерева (обход по уровням): ${arr(lvlO(T))}. Самый длинный путь от корня до листа содержит ${h} рёбер.`}}},
{t:"Кучи",d:"h",f:r=>{const keys=shR(r,range(1,50)).slice(0,7);const H=heapIns(keys);const o=sOpts(arr(H),[arr(heapify(keys)),arr([...keys].sort((a,b)=>a-b)),arr(keys),arr(heapIns([...keys].reverse()))]);if(!o)return null;return{q:`Ключи ${keys.join(", ")} по одному вставляют в пустую двоичную min-кучу (просеивание вверх). Как будет выглядеть массив кучи?`,o,e:`После каждой вставки элемент поднимается, пока он меньше родителя (родитель i — ⌊(i − 1)/2⌋). Итог: ${arr(H)}. Отсортированный массив тоже является кучей, но вставками получается другой.`}}},

/* ---------- формирование теста ---------- */
function pick(s,n){
  const pool=POOL[s], nh=Math.round(n*0.75), nm=n-nh;
  let seen=new Set(LS.get("seen:"+s,[]));
  const fams=new Set(), chosen=[];
  const take=(d,cnt)=>{const cand=pool.filter(q=>q.d===d);const ordered=[...shuffle(cand.filter(q=>!seen.has(q.id))),...shuffle(cand.filter(q=>seen.has(q.id)))];const out=[];
    for(const q of ordered){if(out.length===cnt)break;if(fams.has(q.fam))continue;fams.add(q.fam);out.push(q.id)}
    for(const q of ordered){if(out.length===cnt)break;if(!out.includes(q.id))out.push(q.id)}
    return out};
  chosen.push(...take("h",nh),...take("m",nm));
  chosen.forEach(id=>seen.add(id));
  if(seen.size>pool.length*0.8) seen=new Set(chosen);
  LS.set("seen:"+s,[...seen]);
  return chosen;
}
const mkPerm=ids=>Object.fromEntries(ids.map(id=>[id,shuffle([0,1,2,3])]));
function newTest(kind){
  const ids = kind==="mix" ? ORDER.flatMap(s=>pick(s,MIX_N)) : pick(kind,TEST_N);
  const order = shuffle(ids);
  return {kind,ids:order,perm:mkPerm(order),ans:{},cur:0,attempt:1,prev:null};
}
function retake(t,res){const ids=shuffle(t.ids);return {kind:t.kind,ids,perm:mkPerm(ids),ans:{},cur:0,attempt:t.attempt+1,prev:{correct:res.correct,total:res.total}}}

/* ---------- маршруты ---------- */
let state={};
function go(view,data){state={view,...data};$("#modal-root").innerHTML="";({home:renderHome,test:renderTest,results:renderResults})[view]();window.scrollTo({top:0})}
$("#brand").onclick=()=>{if(state.view==="test"){confirmBox("Прервать тест?","Ответы сохранятся: тест можно будет продолжить с главной страницы.","Выйти",()=>go("home"))}else go("home")};
function confirmBox(title,text,ok,onOk,danger){const root=$("#modal-root");root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="sheet"><h2 id="mt">${title}</h2><p class="muted">${text}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="m-no">Отмена</button><button class="btn ${danger?"danger":"primary"}" id="m-ok">${ok}</button></div></div></div>`;$("#m-no").onclick=()=>root.innerHTML="";$("#m-ok").onclick=()=>{root.innerHTML="";onOk()};$("#m-ok").focus()}

/* ---------- главная ---------- */
function renderHome(){
  $("#ctx").textContent="";
  const saved=LS.get("test",null), stats=LS.get("stats",{});
  const validSaved=saved&&saved.ids.every(id=>QBY[id]);
  const card=(k)=>{const st=stats[k];const total=k==="mix"?ORDER.reduce((a,s)=>a+POOL[s].length,0):POOL[k].length;const n=k==="mix"?MIX_N*ORDER.length:TEST_N;
    const meta=`<div class="meta"><span><b>${n}</b> вопросов в тесте</span><span><b>${total}</b> в базе</span>${st?`<span>последний <b>${st.last}%</b></span><span>лучший <b>${st.best}%</b></span>`:""}</div>`;
    if(k==="mix")return `<div class="sheet subj mix"><div class="top"><h2>Смешанный тест</h2><p class="muted small">По ${MIX_N} вопросов из каждого предмета, итог и разбивка по предметам.</p>${meta}</div><button class="btn" data-start="mix">Начать</button></div>`;
    return `<div class="sheet subj"><div class="top"><h2>${SUBJECTS[k].name}</h2><p class="muted small">${SUBJECTS[k].about}</p>${meta}</div><button class="btn primary" data-start="${k}">Начать тест</button></div>`};
  app.innerHTML=`<section class="view">
    ${validSaved?`<div class="sheet resume row" style="justify-content:space-between"><div><div class="eyebrow">Незавершённый тест</div><p><b>${kindName(saved.kind)}</b> · отвечено ${Object.keys(saved.ans).length} из ${saved.ids.length}</p></div><div class="row"><button class="btn ghost" id="drop">Удалить</button><button class="btn primary" id="resume">Продолжить</button></div></div>`:""}
    <div class="intro"><h1>Подготовка к экзаменам на сложных вопросах</h1><p class="muted">Каждый тест собирается случайно из базы предмета: 75% сложных и 25% средних вопросов. Сначала даются вопросы, которых вы ещё не видели. После теста — разбор ошибок и повтор того же набора.</p></div>
    <div class="subjects">${ORDER.map(card).join("")}${card("mix")}</div>
  </section>`;
  app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{const start=()=>{const t=newTest(b.dataset.start);LS.set("test",t);go("test",{t})};if(validSaved)confirmBox("Начать новый тест?","Незавершённый тест будет удалён.","Начать",start,true);else start()});
  if(validSaved){$("#resume").onclick=()=>go("test",{t:saved});$("#drop").onclick=()=>confirmBox("Удалить незавершённый тест?","Ответы этой попытки пропадут.","Удалить",()=>{LS.del("test");renderHome()},true)}
  else if(saved) LS.del("test");
}

/* ---------- прохождение ---------- */
function renderTest(){
  const t=state.t, save=()=>LS.set("test",t);
  $("#ctx").textContent=kindName(t.kind)+(t.attempt>1?` · попытка ${t.attempt}`:"");
  const draw=()=>{
    const id=t.ids[t.cur], q=QBY[id], P=q.ctx?PASSAGES[q.ctx]:null;
    const done=Object.keys(t.ans).length, n=t.ids.length;
    const opts=t.perm[id].map((oi,k)=>`<button class="opt" data-oi="${oi}" aria-pressed="${t.ans[id]===oi}"><span class="mk">${LET[k]}</span><span>${esc(q.o[oi])}</span></button>`).join("");
    app.innerHTML=`<section class="view">
      <div class="test-head"><div class="progress"><div class="row small" style="justify-content:space-between"><span class="mono">Вопрос ${t.cur+1} из ${n}</span><span class="muted">отвечено ${done}</span></div><div class="track"><i style="width:${done/n*100}%"></i></div></div><button class="btn danger" id="finish">Завершить</button></div>
      <div class="test-grid">
        <div class="qwrap ${P?"split":""}">
          ${P?`<aside class="passage"><span class="eyebrow">Reading · ${P.title}</span>${P.text.split("\n\n").map(p=>`<p>${esc(p)}</p>`).join("")}</aside>`:""}
          <div class="sheet qcard">
            <div class="qhead"><span class="qnum">№${t.cur+1}</span><span class="pill">${t.kind==="mix"?SUBJECTS[q.s].name+" · ":""}${esc(q.t)}</span></div>
            <div class="qtext">${q.q}</div>
            <div class="opts" role="group" aria-label="Варианты ответа">${opts}</div>
            <div class="qnav"><button class="btn" id="prev" ${t.cur===0?"disabled":""}>← Назад</button><button class="btn primary" id="next">${t.cur===n-1?"Завершить тест":"Далее →"}</button></div>
          </div>
        </div>
        <aside class="sheet palette"><b>Бланк ответов</b><div class="pal-grid">${t.ids.map((x,i)=>`<button class="cell ${t.ans[x]!==undefined?"ans":""} ${i===t.cur?"cur":""}" data-i="${i}" aria-label="Вопрос ${i+1}">${i+1}</button>`).join("")}</div><span class="kbd">Клавиши: 1–4 — ответ, ← → — переход</span></aside>
      </div></section>`;
    app.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{const oi=+el.dataset.oi;if(t.ans[id]===oi)delete t.ans[id];else t.ans[id]=oi;save();draw()});
    app.querySelectorAll(".cell").forEach(el=>el.onclick=()=>{t.cur=+el.dataset.i;save();draw()});
    $("#prev").onclick=()=>{t.cur--;save();draw()};
    $("#next").onclick=()=>{if(t.cur<n-1){t.cur++;save();draw()}else askFinish()};
    $("#finish").onclick=askFinish;
  };
  const askFinish=()=>{const left=t.ids.length-Object.keys(t.ans).length;confirmBox("Завершить тест?",left?`Без ответа осталось ${left}. Такие вопросы засчитываются как неправильные.`:"Все вопросы отвечены. После завершения ответы изменить нельзя.","Завершить",finish,left>0)};
  const finish=()=>{
    const per={};let correct=0;
    t.ids.forEach(id=>{const q=QBY[id];const ok=t.ans[id]===0;if(ok)correct++;per[q.s]=per[q.s]||{c:0,n:0};per[q.s].n++;if(ok)per[q.s].c++});
    const res={kind:t.kind,total:t.ids.length,correct,unanswered:t.ids.filter(id=>t.ans[id]===undefined).length,per,test:t};
    res.pct=Math.round(correct/res.total*100);
    const stats=LS.get("stats",{});const st=stats[t.kind]||{best:0,n:0};stats[t.kind]={last:res.pct,best:Math.max(st.best,res.pct),n:st.n+1};LS.set("stats",stats);
    LS.del("test");LS.set("last",res);go("results",{res});
  };
  document.onkeydown=e=>{if(state.view!=="test"||$("#modal-root").innerHTML)return;const n=t.ids.length,id=t.ids[t.cur];
    if(e.key==="ArrowRight"&&t.cur<n-1){t.cur++;save();draw()}else if(e.key==="ArrowLeft"&&t.cur>0){t.cur--;save();draw()}
    else if(/^[1-4]$/.test(e.key)){t.ans[id]=t.perm[id][+e.key-1];save();draw()}};
  draw();
}

/* ---------- результаты ---------- */
const grade=p=>p>=85?["Отлично","var(--ok)"]:p>=70?["Хорошо","var(--accent)"]:p>=50?["Удовлетворительно","var(--warn)"]:["Нужно подтянуть","var(--bad)"];
function renderResults(){
  const res=state.res||LS.get("last",null);
  if(!res||!res.test.ids.every(id=>QBY[id])){go("home");return}
  $("#ctx").textContent=kindName(res.kind);
  const t=res.test, wrong=t.ids.filter(id=>t.ans[id]!==0), [gl,gc]=grade(res.pct);
  const prev=t.prev?`<p class="small muted">В прошлой попытке этого набора: ${t.prev.correct} из ${t.prev.total}. ${res.correct>t.prev.correct?`Стало лучше на ${res.correct-t.prev.correct}.`:res.correct<t.prev.correct?`Стало хуже на ${t.prev.correct-res.correct}.`:"Результат тот же."}</p>`:"";
  const breakdown=res.kind==="mix"?`<div class="sheet breakdown"><h2>По предметам</h2>${ORDER.map(s=>{const p=res.per[s];if(!p)return"";const pc=Math.round(p.c/p.n*100);return `<div class="brow"><span>${SUBJECTS[s].name}</span><div class="bar"><i style="width:${pc}%"></i></div><span class="mono" style="text-align:right">${p.c}/${p.n}</span></div>`}).join("")}</div>`:"";
  const item=(id,i)=>{const q=QBY[id],a=t.ans[id],P=q.ctx?PASSAGES[q.ctx]:null;return `<article class="sheet wi">
      <div class="qhead"><span class="qnum">№${t.ids.indexOf(id)+1}</span><span class="pill">${res.kind==="mix"?SUBJECTS[q.s].name+" · ":""}${esc(q.t)}</span></div>
      ${P?`<details><summary>Текст «${P.title}»</summary><div class="passage">${P.text.split("\n\n").map(p=>`<p>${esc(p)}</p>`).join("")}</div></details>`:""}
      <div class="qtext">${q.q}</div>
      <div class="ans-line bad"><span class="lbl">Ваш ответ</span><span>${a===undefined?"<i>нет ответа</i>":esc(q.o[a])}</span></div>
      <div class="ans-line ok"><span class="lbl">Правильный ответ</span><span>${esc(q.o[0])}</span></div>
      <p class="why">${q.e}</p></article>`};
  app.innerHTML=`<section class="view">
    <div class="sheet score">
      <div style="display:grid;gap:6px"><span class="eyebrow">${kindName(res.kind)}${t.attempt>1?` · попытка ${t.attempt}`:""}</span><div class="big">${res.pct}%</div><span class="grade" style="color:${gc}">${gl}</span></div>
      <div style="display:grid;gap:12px">
        <div class="figures"><div><span class="eyebrow">Итог</span><span class="v">${res.correct}/${res.total}</span></div><div><span class="eyebrow">Правильно</span><span class="v ok">${res.correct}</span></div><div><span class="eyebrow">Неправильно</span><span class="v bad">${res.total-res.correct}</span></div></div>
        ${res.unanswered?`<p class="small muted">Из неправильных без ответа: ${res.unanswered}.</p>`:""}${prev}
        <div class="row"><button class="btn primary" id="again">Пройти этот набор снова</button><button class="btn" id="fresh">Новый тест</button><button class="btn ghost" id="home">К предметам</button></div>
        <p class="small muted">«Снова» — те же вопросы в новом порядке, с перемешанными вариантами. «Новый тест» соберёт другой набор из базы.</p>
      </div>
    </div>
    ${breakdown}
    <div style="display:grid;gap:12px"><h2>${wrong.length?`Ошибки (${wrong.length})`:"Ошибок нет"}</h2>
      ${wrong.length?`<div class="wrong-list">${wrong.map(item).join("")}</div>`:`<div class="empty">Все ответы верные. Попробуйте новый тест: база подберёт вопросы, которых вы ещё не видели.</div>`}</div>
  </section>`;
  $("#again").onclick=()=>{const nt=retake(t,res);LS.set("test",nt);go("test",{t:nt})};
  $("#fresh").onclick=()=>{const nt=newTest(res.kind);LS.set("test",nt);go("test",{t:nt})};
  $("#home").onclick=()=>go("home");
}

go("home");
</script>
</body>
</html>
